name = "rwa-perps-keeper"
main = "worker.ts"
compatibility_date = "2024-09-23"
# Needed: the shared keeper modules use Node APIs (process.env, node crypto via viem).
compatibility_flags = ["nodejs_compat"]
# Cron-only worker: no public HTTP endpoint, so no workers.dev subdomain needed.
workers_dev = false

# Fire one tick every minute (Cloudflare cron min granularity). This replaces the Node setInterval loop.
[triggers]
crons = ["* * * * *"]

# --- ACTIVE: Robinhood TESTNET (46630) — for verifying the Worker before mainnet. ---
[vars]
PRICE_SOURCE = "tradingeconomics"
CHAIN_ID = "46630"
RPC_URL = "https://rpc.testnet.chain.robinhood.com"
ORACLE_ADDRESS = "0xd3Fa9008eC7511f3d32A1760C3Ea52c58111f140"
REGISTRY_ADDRESS = "0xFc7e57695D3b44393Ed007e45527e1eaB9Df58D6"
DRY_RUN = "false"  # live: sign + post on-chain. (Was "true" for the first dry-run verification.)
POST_BATCH_LIMIT = "0"  # Workers Paid: no cap — post all 23 markets every minute.

# Workers Paid: claim the full CPU budget (free was ~10ms; this ends the "Exceeded CPU Limit" freezes).
[limits]
cpu_ms = 30000

# --- MAINNET (4663) — swap these in at mainnet launch (with the KMS/mainnet signer). ---
# CHAIN_ID = "4663"
# RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
# ORACLE_ADDRESS = "0x<mainnet oracle>"
# REGISTRY_ADDRESS = "0x<mainnet registry>"
# DRY_RUN = "false"

# SECRETS — already set via `wrangler secret put TE_API_KEY` and `wrangler secret put PRIVATE_KEY`.
# (For testnet the PRIVATE_KEY is the throwaway signer 0x914c93…; regenerate for mainnet.)

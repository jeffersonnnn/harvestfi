[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 40
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }

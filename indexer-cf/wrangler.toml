name = "rwa-perps-indexer"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Index once a minute (positions from logs + a price snapshot per market).
[triggers]
crons = ["* * * * *"]

# D1 database. Create it with `wrangler d1 create rwa-perps`, then paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "rwa-perps"
database_id = "b26bb92c-eef4-46b8-a291-3553b14679d2"

# --- ACTIVE: Robinhood MAINNET (4663). Testnet values kept in the comment below for rollback. ---
[vars]
CHAIN_ID = "4663"
RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
ENGINE_ADDRESS = "0x343635C6602169993DA969A1E813093ba19A074a"
ORACLE_ADDRESS = "0x43F4B3E880437De908f418B199daE8F326F0F41A"
REGISTRY_ADDRESS = "0xB56AB31fb1F1559c435A72B5Fd3c7E63baea3D96"
START_BLOCK = "35300227"
MAX_RANGE = "3000"      # blocks scanned per tick; backfills over successive runs
MAX_BLOCK_META = "24"   # cap on getBlock calls/tick (stay under the 50-subrequest limit)

